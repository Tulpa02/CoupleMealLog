org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ===== 构建稳定性配置（Windows 上常见问题规避）=====
# 1) 关闭 Kotlin 增量编译：编译中途被打断（杀进程 / 网络重试）会让
#    caches-jvm 里的 .tab 文件损坏，导致 "Could not close incremental caches"。
kotlin.incremental=false
# 2) 关闭 Gradle 构建缓存，避免复用损坏的产物
org.gradle.caching=false
# 3) 关闭配置缓存，减少跨次构建的状态残留
org.gradle.configuration-cache=false
# 4) 禁用文件系统监视（Windows 上频繁触发，且对被占用文件较敏感）
org.gradle.vfs.watch=false
# 5) Kotlin 编译器在 Gradle 进程内运行，避免独立的 Kotlin daemon 持有缓存文件句柄
kotlin.compiler.execution.strategy=in-process
